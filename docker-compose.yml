version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=knova_db
      - POSTGRES_USER=knova_user
      - POSTGRES_PASSWORD=knova_secure_password
    ports:
      - "5432:5432"
    restart: unless-stopped

  web:
    build: .
    command: >
      bash -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn knova_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=generate-a-secure-secret-key-here
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
      - SQLENGINE=django.db.backends.postgresql
      - SQLDATABASE=knova_db
      - SQLUSER=knova_user
      - SQLPASSWORD=knova_secure_password
      - SQLHOST=db
      - SQLPORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery:
    build: .
    command: celery -A knova_backend worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=0
      - SECRET_KEY=generate-a-secure-secret-key-here
      - SQLENGINE=django.db.backends.postgresql
      - SQLDATABASE=knova_db
      - SQLUSER=knova_user
      - SQLPASSWORD=knova_secure_password
      - SQLHOST=db
      - SQLPORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
