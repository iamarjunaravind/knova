<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KNOVA Gate Check-In Mobile App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070a12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --accent-blue: #38bdf8;
      --accent-indigo: #6366f1;
      --success-green: #10b981;
      --warning-amber: #f59e0b;
      --error-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; }
    #appContainer { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
    .app-header { position: absolute; top: 0; left: 0; right: 0; z-index: 30; padding: calc(var(--safe-top) + 12px) 16px 12px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(180deg, rgba(7,10,18,0.95) 0%, rgba(7,10,18,0.6) 75%, transparent 100%); backdrop-filter: blur(12px); }
    .brand-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 999px; }
    .live-dot { width: 8px; height: 8px; background: var(--success-green); border-radius: 50%; box-shadow: 0 0 10px var(--success-green); animation: pulseDot 1.8s infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.4;transform:scale(0.85);} }
    .brand-title { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; }
    .stat-badge { display: flex; align-items: center; gap: 6px; background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3); padding: 5px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
    .stat-badge span.num { color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .stat-badge span.total { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: var(--text-main); font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; }
    .icon-btn.active { background: #f59e0b; color: #070a12; border-color: #f59e0b; box-shadow: 0 0 16px rgba(245,158,11,0.5); }
    .icon-btn.muted { color: #ef4444; }
    .scanner-viewport { position: relative; flex: 1; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
    #reader { width: 100% !important; height: 100% !important; object-fit: cover !important; border: none !important; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
    .reticle-container { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .reticle-box { position: relative; width: 270px; height: 270px; border-radius: 24px; box-shadow: 0 0 0 9999px rgba(7,10,18,0.55); display: flex; align-items: center; justify-content: center; }
    .corner { position: absolute; width: 32px; height: 32px; border: 4px solid var(--accent-blue); box-shadow: 0 0 12px rgba(56,189,248,0.6); pointer-events: none; }
    .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
    .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
    .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 20px; }
    .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 20px; }
    .laser-line { position: absolute; top: 10%; left: 10px; right: 10px; height: 3px; background: linear-gradient(90deg, transparent 0%, #38bdf8 30%, #a855f7 50%, #38bdf8 70%, transparent 100%); box-shadow: 0 0 14px #38bdf8; border-radius: 50%; animation: laserSweep 2s ease-in-out infinite alternate; }
    @keyframes laserSweep { 0% { top: 8%; opacity: 0.8; } 50% { opacity: 1; } 100% { top: 90%; opacity: 0.8; } }
    .reticle-hint { margin-top: 24px; font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.85); background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 999px; backdrop-filter: blur(8px); }
    .camera-placeholder { position: absolute; inset: 0; background: #070a12; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; z-index: 5; }
    .camera-placeholder i { font-size: 3rem; color: var(--accent-blue); margin-bottom: 16px; }
    .start-cam-btn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; padding: 12px 28px; border-radius: 999px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .bottom-bar { position: absolute; bottom: calc(var(--safe-bottom) + 16px); left: 16px; right: 16px; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pill-btn { flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; color: var(--text-main); font-size: 0.85rem; font-weight: 700; backdrop-filter: blur(16px); cursor: pointer; }
    .result-sheet { position: absolute; bottom: 0; left: 0; right: 0; z-index: 50; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.12); border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 16px 20px calc(var(--safe-bottom) + 20px); box-shadow: 0 -10px 40px rgba(0,0,0,0.8); transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); }
    .result-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 42px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 999px; margin: 0 auto 16px; }
    .result-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .result-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 800; flex-shrink: 0; }
    .result-avatar.amber { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .result-avatar.red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
    .result-title-block { flex: 1; overflow: hidden; }
    .attendee-name { font-size: 1.25rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .role-badge { display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-top: 4px; text-transform: uppercase; }
    .role-badge.student { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .role-badge.parent { background: rgba(168,85,247,0.18); color: #c084fc; border: 1px solid rgba(168,85,247,0.35); }
    .role-badge.exhibitor { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .role-badge.other { background: rgba(148,163,184,0.18); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.35); }
    .status-banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; font-size: 0.88rem; font-weight: 700; margin-bottom: 14px; }
    .status-banner.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.35); color: #34d399; }
    .status-banner.warning { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.35); color: #fbbf24; }
    .status-banner.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.35); color: #f87171; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 12px; border-radius: 14px; margin-bottom: 16px; }
    .meta-label { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .meta-value { font-size: 0.84rem; font-weight: 600; color: #f1f5f9; font-family: 'JetBrains Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .countdown-bar-wrap { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
    .countdown-bar-fill { height: 100%; width: 100%; background: var(--accent-blue); border-radius: 999px; transition: width 1.8s linear; }
    .action-btn-primary { width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 999px; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { width: 100%; max-width: 500px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.12); border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 20px 20px calc(var(--safe-bottom) + 24px); }
    .manual-input { width: 100%; height: 52px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.15); border-radius: 14px; color: #fff; font-size: 1.05rem; font-family: 'JetBrains Mono', monospace; padding: 0 16px; outline: none; margin: 14px 0; text-transform: uppercase; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-btn-cancel { flex: 1; height: 48px; background: rgba(255,255,255,0.08); color: var(--text-muted); border: none; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .modal-btn-submit { flex: 2; height: 48px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; border-radius: 999px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
<div id="appContainer">
  <header class="app-header">
    <div class="brand-pill">
      <div class="live-dot"></div>
      <span class="brand-title">KNOVA GATE SCAN</span>
    </div>
    <div class="stat-badge">
      <i class="fa-solid fa-users-viewfinder" style="color: #818cf8;"></i>
      <span class="num" id="statCheckedIn">-</span>
      <span class="total">/ <span id="statTotal">-</span></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnTorch" title="Toggle Flashlight" onclick="toggleTorch()"><i class="fa-solid fa-bolt"></i></button>
      <button class="icon-btn" id="btnFlipCam" title="Flip Camera" onclick="flipCamera()"><i class="fa-solid fa-camera-rotate"></i></button>
      <button class="icon-btn" id="btnSound" title="Toggle Sound" onclick="toggleSound()"><i class="fa-solid fa-volume-high"></i></button>
    </div>
  </header>

  <main class="scanner-viewport">
    <div id="reader"></div>
    <div class="reticle-container">
      <div class="reticle-box">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="laser-line"></div>
      </div>
      <div class="reticle-hint">
        <i class="fa-solid fa-qrcode" style="color: var(--accent-blue); margin-right: 6px;"></i>
        Align attendee badge QR code inside frame
      </div>
    </div>
    <div class="camera-placeholder" id="cameraPlaceholder" style="display: none;">
      <i class="fa-solid fa-camera"></i>
      <div style="font-size: 1.15rem; font-weight: 700; margin-bottom: 8px;">Camera Access Required</div>
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px;">Please enable camera permission to scan attendee badges.</div>
      <button class="start-cam-btn" onclick="startScanner()"><i class="fa-solid fa-play"></i> Enable Camera</button>
    </div>
  </main>

  <footer class="bottom-bar">
    <button class="pill-btn" onclick="openManualModal()"><i class="fa-solid fa-keyboard"></i><span>Manual Entry</span></button>
    <button class="pill-btn" onclick="openServerConfig()"><i class="fa-solid fa-server"></i><span id="serverLabel">knovaexpo.com</span></button>
  </footer>

  <!-- RESULT SHEET -->
  <div class="result-sheet" id="resultSheet">
    <div class="sheet-handle"></div>
    <div class="result-header">
      <div class="result-avatar" id="resAvatar">A</div>
      <div class="result-title-block">
        <div class="attendee-name" id="resName">Attendee</div>
        <div class="role-badge student" id="resRole">STUDENT</div>
      </div>
    </div>
    <div class="status-banner success" id="resStatusBanner">
      <i class="fa-solid fa-circle-check" id="resStatusIcon"></i>
      <span id="resStatusText">CHECK-IN CONFIRMED</span>
    </div>
    <div class="meta-grid">
      <div class="meta-item"><span class="meta-label">Badge ID</span><span class="meta-value" id="resBadgeId">-</span></div>
      <div class="meta-item"><span class="meta-label">School / Org</span><span class="meta-value" id="resOrg">-</span></div>
      <div class="meta-item"><span class="meta-label">Time</span><span class="meta-value" id="resTime">-</span></div>
      <div class="meta-item"><span class="meta-label">Contact</span><span class="meta-value" id="resContact">-</span></div>
    </div>
    <div class="countdown-bar-wrap"><div class="countdown-bar-fill" id="countdownFill"></div></div>
    <button class="action-btn-primary" onclick="dismissResult()"><i class="fa-solid fa-arrow-right"></i><span>Scan Next Attendee</span></button>
  </div>

  <!-- MANUAL MODAL -->
  <div class="modal-overlay" id="manualModal">
    <div class="modal-sheet">
      <div class="sheet-handle" onclick="closeManualModal()"></div>
      <div style="font-size: 1.15rem; font-weight: 800;">Manual Badge Check-In</div>
      <div style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;">Enter Badge ID, Registration ID, Email or Phone.</div>
      <input type="text" id="manualCodeInput" class="manual-input" placeholder="e.g. KNOVA-ST-38523">
      <div class="modal-buttons">
        <button class="modal-btn-cancel" onclick="closeManualModal()">Cancel</button>
        <button class="modal-btn-submit" onclick="submitManualCode()">Check In</button>
      </div>
    </div>
  </div>
</div>

<script>
let API_HOST = localStorage.getItem('knova_api_host') || 'https://knovaexpo.com';
document.getElementById('serverLabel').textContent = API_HOST.replace('https://', '').replace('http://', '');

function openServerConfig() {
  const custom = prompt("Set KNOVA Server URL:", API_HOST);
  if (custom && custom.trim()) {
    API_HOST = custom.trim().replace(/\/$/, "");
    localStorage.setItem('knova_api_host', API_HOST);
    document.getElementById('serverLabel').textContent = API_HOST.replace('https://', '').replace('http://', '');
    refreshStats();
  }
}

// Audio Chime
let audioCtx = null;
let soundEnabled = true;
function playChime(freq1, freq2) {
  if (!soundEnabled) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.frequency.setValueAtTime(freq1, now);
    osc2.frequency.setValueAtTime(freq2, now);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
    osc1.start(now); osc2.start(now); osc1.stop(now + 0.3); osc2.stop(now + 0.3);
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('btnSound');
  btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
  btn.classList.toggle('muted', !soundEnabled);
}

// Camera Scanner
let html5QrCode = null;
let currentFacingMode = "environment";
let isScanning = false;
let isProcessing = false;
let resumeTimer = null;
let activeVideoTrack = null;
let torchActive = false;

function startScanner() {
  document.getElementById('cameraPlaceholder').style.display = 'none';
  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("reader", { experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  }
  const qrBoxSize = Math.min(window.innerWidth * 0.72, 270);
  html5QrCode.start(
    { facingMode: currentFacingMode },
    { fps: 25, qrbox: { width: qrBoxSize, height: qrBoxSize } },
    (decoded) => { if (!isProcessing) { isProcessing = true; processCheckIn(decoded); } },
    () => {}
  ).then(() => {
    isScanning = true;
    try {
      const v = document.querySelector("#reader video");
      if (v && v.srcObject) activeVideoTrack = v.srcObject.getVideoTracks()[0];
    } catch(e) {}
  }).catch(() => {
    document.getElementById('cameraPlaceholder').style.display = 'flex';
  });
}

function flipCamera() {
  currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
  if (html5QrCode) html5QrCode.stop().then(startScanner).catch(startScanner);
}

function toggleTorch() {
  if (!activeVideoTrack) { alert("Torch not supported on this camera."); return; }
  torchActive = !torchActive;
  activeVideoTrack.applyConstraints({ advanced: [{ torch: torchActive }] }).then(() => {
    document.getElementById('btnTorch').classList.toggle('active', torchActive);
  }).catch(() => { torchActive = false; });
}

async function processCheckIn(code) {
  try {
    const res = await fetch(`${API_HOST}/api/mobile-checkin/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code.trim() })
    });
    const data = await res.json();
    renderResult(data, code);
  } catch(e) {
    renderResult({ status: 'ERROR', message: 'Network connection failed.' }, code);
  }
}

function renderResult(data, code) {
  const sheet = document.getElementById('resultSheet');
  const banner = document.getElementById('resStatusBanner');
  const avatar = document.getElementById('resAvatar');
  const nameEl = document.getElementById('resName');
  const roleEl = document.getElementById('resRole');
  const statusIcon = document.getElementById('resStatusIcon');
  const statusText = document.getElementById('resStatusText');

  banner.className = 'status-banner';
  avatar.className = 'result-avatar';

  if (data.status === 'SUCCESS') {
    playChime(587.33, 880);
    if (navigator.vibrate) navigator.vibrate([70]);
    banner.classList.add('success');
    statusIcon.className = 'fa-solid fa-circle-check';
    statusText.textContent = 'CHECK-IN CONFIRMED';
    const a = data.attendee || {};
    nameEl.textContent = a.full_name || 'Attendee';
    avatar.textContent = a.initials || 'A';
    roleEl.textContent = (a.role || 'STUDENT').toUpperCase();
    document.getElementById('resBadgeId').textContent = a.badge_id || code;
    document.getElementById('resOrg').textContent = a.school_or_org || '-';
    document.getElementById('resTime').textContent = a.checked_in_time || 'Just now';
    document.getElementById('resContact').textContent = a.email || a.phone || '-';
    if (data.stats) updateStats(data.stats);
  } else if (data.status === 'ALREADY_CHECKED_IN') {
    playChime(440, 370);
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    banner.classList.add('warning');
    avatar.classList.add('amber');
    statusIcon.className = 'fa-solid fa-triangle-exclamation';
    statusText.textContent = 'ALREADY CHECKED IN';
    const a = data.attendee || {};
    nameEl.textContent = a.full_name || 'Attendee';
    avatar.textContent = a.initials || 'A';
    roleEl.textContent = (a.role || 'STUDENT').toUpperCase();
    document.getElementById('resBadgeId').textContent = a.badge_id || code;
    document.getElementById('resOrg').textContent = a.school_or_org || '-';
    document.getElementById('resTime').textContent = a.checked_in_time ? `Prev at ${a.checked_in_time}` : 'Earlier today';
    document.getElementById('resContact').textContent = a.email || a.phone || '-';
  } else {
    playChime(220, 110);
    if (navigator.vibrate) navigator.vibrate([300]);
    banner.classList.add('error');
    avatar.classList.add('red');
    statusIcon.className = 'fa-solid fa-circle-xmark';
    statusText.textContent = 'UNREGISTERED BADGE';
    nameEl.textContent = 'Unknown Attendee';
    avatar.textContent = '?';
    roleEl.textContent = 'UNKNOWN';
    document.getElementById('resBadgeId').textContent = code;
    document.getElementById('resOrg').textContent = 'Not found';
    document.getElementById('resTime').textContent = '-';
    document.getElementById('resContact').textContent = '-';
  }

  sheet.classList.add('open');
  const fill = document.getElementById('countdownFill');
  fill.style.transition = 'none'; fill.style.width = '100%';
  fill.offsetHeight;
  fill.style.transition = 'width 1.8s linear'; fill.style.width = '0%';
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(dismissResult, 1800);
}

function dismissResult() {
  clearTimeout(resumeTimer);
  document.getElementById('resultSheet').classList.remove('open');
  setTimeout(() => { isProcessing = false; }, 400);
}

function updateStats(s) {
  if (s.total_checked_in !== undefined) document.getElementById('statCheckedIn').textContent = s.total_checked_in;
  if (s.total_registered !== undefined) document.getElementById('statTotal').textContent = s.total_registered;
}

async function refreshStats() {
  try {
    const r = await fetch(`${API_HOST}/api/mobile-checkin/stats/`);
    const d = await r.json();
    if (d.status === 'SUCCESS') updateStats(d);
  } catch(e) {}
}

function openManualModal() { document.getElementById('manualModal').classList.add('open'); document.getElementById('manualCodeInput').value = ''; }
function closeManualModal() { document.getElementById('manualModal').classList.remove('open'); }
function submitManualCode() {
  const c = document.getElementById('manualCodeInput').value.trim();
  if (c) { closeManualModal(); isProcessing = true; processCheckIn(c); }
}

window.addEventListener('DOMContentLoaded', () => {
  startScanner();
  refreshStats();
  setInterval(refreshStats, 15000);
});
</script>
</body>
</html>
