<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KNOVA 4-in-1 Mobile Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070a12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 23, 42, 0.88);
      --mode-color: #38bdf8;
      --mode-glow: rgba(56, 189, 248, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body.mode-gate { --mode-color: #38bdf8; --mode-glow: rgba(56, 189, 248, 0.4); }
    body.mode-booth { --mode-color: #f59e0b; --mode-glow: rgba(245, 158, 11, 0.4); }
    body.mode-seminar { --mode-color: #c084fc; --mode-glow: rgba(192, 132, 252, 0.4); }
    body.mode-counselling { --mode-color: #34d399; --mode-glow: rgba(52, 211, 153, 0.4); }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; }
    #appContainer { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
    .app-header { position: absolute; top: 0; left: 0; right: 0; z-index: 30; padding: calc(var(--safe-top) + 8px) 14px 6px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(180deg, rgba(7,10,18,0.96) 0%, rgba(7,10,18,0.85) 85%, transparent 100%); backdrop-filter: blur(14px); }
    .header-top-row { display: flex; align-items: center; justify-content: space-between; }
    .brand-pill { display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 999px; }
    .live-dot { width: 8px; height: 8px; background: var(--mode-color); border-radius: 50%; box-shadow: 0 0 10px var(--mode-color); animation: pulseDot 1.8s infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.35;transform:scale(0.85);} }
    .brand-title { font-size: 0.76rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; }
    .stat-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; }
    .stat-badge span.num { color: var(--mode-color); font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: var(--text-main); font-size: 0.85rem; cursor: pointer; }
    .icon-btn.active { background: #f59e0b; color: #070a12; border-color: #f59e0b; box-shadow: 0 0 14px rgba(245,158,11,0.5); }
    .icon-btn.muted { color: #ef4444; }

    .role-tabs-wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.08); padding: 3px; border-radius: 12px; }
    .role-tab-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 2px; border-radius: 9px; background: transparent; border: none; color: var(--text-muted); font-size: 0.68rem; font-weight: 700; cursor: pointer; gap: 2px; }
    .role-tab-btn.active { background: rgba(255,255,255,0.12); color: #fff; }
    .role-tab-btn[data-mode="gate"].active { background: rgba(56,189,248,0.2); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .role-tab-btn[data-mode="booth"].active { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .role-tab-btn[data-mode="seminar"].active { background: rgba(192,132,252,0.2); color: #c084fc; border: 1px solid rgba(192,132,252,0.35); }
    .role-tab-btn[data-mode="counselling"].active { background: rgba(52,211,153,0.2); color: #34d399; border: 1px solid rgba(52,211,153,0.35); }

    .scanner-viewport { position: relative; flex: 1; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
    #reader { width: 100% !important; height: 100% !important; object-fit: cover !important; border: none !important; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
    .reticle-container { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .reticle-box { position: relative; width: 260px; height: 260px; border-radius: 24px; box-shadow: 0 0 0 9999px rgba(7,10,18,0.58); display: flex; align-items: center; justify-content: center; }
    .corner { position: absolute; width: 32px; height: 32px; border: 4px solid var(--mode-color); box-shadow: 0 0 12px var(--mode-glow); pointer-events: none; }
    .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
    .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
    .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 20px; }
    .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 20px; }
    .laser-line { position: absolute; top: 10%; left: 10px; right: 10px; height: 3px; background: linear-gradient(90deg, transparent 0%, var(--mode-color) 50%, transparent 100%); box-shadow: 0 0 14px var(--mode-color); border-radius: 50%; animation: laserSweep 2s ease-in-out infinite alternate; }
    @keyframes laserSweep { 0% { top: 8%; opacity: 0.8; } 50% { opacity: 1; } 100% { top: 90%; opacity: 0.8; } }
    .reticle-hint { margin-top: 22px; font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.9); background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.12); padding: 5px 14px; border-radius: 999px; backdrop-filter: blur(8px); text-align: center; }

    .bottom-bar { position: absolute; bottom: calc(var(--safe-bottom) + 14px); left: 14px; right: 14px; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pill-btn { flex: 1; height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(15,23,42,0.88); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; color: var(--text-main); font-size: 0.82rem; font-weight: 700; backdrop-filter: blur(16px); cursor: pointer; }
    .pill-btn i { color: var(--mode-color); font-size: 0.95rem; }

    .result-sheet { position: absolute; bottom: 0; left: 0; right: 0; z-index: 50; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.12); border-top-left-radius: 26px; border-top-right-radius: 26px; padding: 14px 18px calc(var(--safe-bottom) + 18px); box-shadow: 0 -10px 40px rgba(0,0,0,0.85); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .result-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 38px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 999px; margin: 0 auto 12px; }
    .result-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .result-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; flex-shrink: 0; }
    .result-avatar.amber { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .result-avatar.purple { background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); }
    .result-avatar.green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .result-avatar.red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
    .attendee-name { font-size: 1.2rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .role-badge { display: inline-flex; align-items: center; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-top: 3px; text-transform: uppercase; }
    .role-badge.student { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .role-badge.parent { background: rgba(168,85,247,0.18); color: #c084fc; border: 1px solid rgba(168,85,247,0.35); }
    .role-badge.exhibitor { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .role-badge.other { background: rgba(148,163,184,0.18); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.35); }
    .status-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; }
    .status-banner.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.35); color: #34d399; }
    .status-banner.warning { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.35); color: #fbbf24; }
    .status-banner.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.35); color: #f87171; }
    .reward-pill { font-size: 0.72rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #fff; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 10px 12px; border-radius: 12px; margin-bottom: 14px; }
    .meta-label { font-size: 0.65rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .meta-value { font-size: 0.82rem; font-weight: 600; color: #f1f5f9; font-family: 'JetBrains Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .countdown-bar-wrap { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
    .countdown-bar-fill { height: 100%; width: 100%; background: var(--mode-color); border-radius: 999px; transition: width 1.8s linear; }
    .action-btn-primary { width: 100%; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 999px; font-size: 0.92rem; font-weight: 800; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(8px); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { width: 100%; max-width: 500px; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.12); border-top-left-radius: 26px; border-top-right-radius: 26px; padding: 18px 18px calc(var(--safe-bottom) + 20px); }
    .manual-input { width: 100%; height: 50px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 1rem; font-family: 'JetBrains Mono', monospace; padding: 0 16px; outline: none; margin: 12px 0; text-transform: uppercase; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-btn-cancel { flex: 1; height: 46px; background: rgba(255,255,255,0.08); color: var(--text-muted); border: none; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .modal-btn-submit { flex: 2; height: 46px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; border-radius: 999px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body class="mode-gate">
<div id="appContainer">
  <header class="app-header">
    <div class="header-top-row">
      <div class="brand-pill"><div class="live-dot"></div><span class="brand-title" id="brandTitle">KNOVA GATE SCAN</span></div>
      <div class="stat-badge"><span class="label" id="statLabel">Checked In:</span> <span class="num" id="statCount">-</span></div>
      <div class="header-actions">
        <button class="icon-btn" id="btnTorch" title="Torch" onclick="toggleTorch()"><i class="fa-solid fa-bolt"></i></button>
        <button class="icon-btn" id="btnFlipCam" title="Flip" onclick="flipCamera()"><i class="fa-solid fa-camera-rotate"></i></button>
        <button class="icon-btn" id="btnSound" title="Sound" onclick="toggleSound()"><i class="fa-solid fa-volume-high"></i></button>
      </div>
    </div>
    <nav class="role-tabs-wrap">
      <button class="role-tab-btn active" data-mode="gate" onclick="switchScannerMode('gate')"><i class="fa-solid fa-door-open"></i><span>Gate Entry</span></button>
      <button class="role-tab-btn" data-mode="booth" onclick="switchScannerMode('booth')"><i class="fa-solid fa-store"></i><span>Booth Visit</span></button>
      <button class="role-tab-btn" data-mode="seminar" onclick="switchScannerMode('seminar')"><i class="fa-solid fa-chalkboard-user"></i><span>Seminars</span></button>
      <button class="role-tab-btn" data-mode="counselling" onclick="switchScannerMode('counselling')"><i class="fa-solid fa-user-graduate"></i><span>Counselling</span></button>
    </nav>
  </header>

  <main class="scanner-viewport">
    <div id="reader"></div>
    <div class="reticle-container">
      <div class="reticle-box">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="laser-line"></div>
      </div>
      <div class="reticle-hint" id="reticleHintText">Point at attendee badge to scan</div>
    </div>
  </main>

  <footer class="bottom-bar">
    <button class="pill-btn" onclick="openManualModal()"><i class="fa-solid fa-keyboard"></i><span>Manual Entry</span></button>
    <button class="pill-btn" onclick="openServerConfig()"><i class="fa-solid fa-server"></i><span id="serverLabel">knovaexpo.com</span></button>
  </footer>

  <div class="result-sheet" id="resultSheet">
    <div class="sheet-handle"></div>
    <div class="result-header">
      <div class="result-avatar" id="resAvatar">A</div>
      <div class="result-title-block">
        <div class="attendee-name" id="resName">Attendee</div>
        <div class="role-badge student" id="resRole">STUDENT</div>
      </div>
    </div>
    <div class="status-banner success" id="resStatusBanner">
      <div style="display:flex; align-items:center; gap:8px;">
        <i class="fa-solid fa-circle-check" id="resStatusIcon"></i>
        <span id="resStatusText">CHECK-IN CONFIRMED</span>
      </div>
      <span class="reward-pill" id="resRewardPill">+20 XP</span>
    </div>
    <div class="meta-grid">
      <div class="meta-item"><span class="meta-label">Station</span><span class="meta-value" id="resStation">-</span></div>
      <div class="meta-item"><span class="meta-label">Badge ID</span><span class="meta-value" id="resBadgeId">-</span></div>
      <div class="meta-item"><span class="meta-label">School / Org</span><span class="meta-value" id="resOrg">-</span></div>
      <div class="meta-item"><span class="meta-label">Time</span><span class="meta-value" id="resTime">-</span></div>
    </div>
    <div class="countdown-bar-wrap"><div class="countdown-bar-fill" id="countdownFill"></div></div>
    <button class="action-btn-primary" onclick="dismissResult()"><i class="fa-solid fa-arrow-right"></i><span>Scan Next Attendee</span></button>
  </div>

  <div class="modal-overlay" id="manualModal">
    <div class="modal-sheet">
      <div class="sheet-handle" onclick="closeManualModal()"></div>
      <div style="font-size: 1.1rem; font-weight: 800;">Manual Badge Punch</div>
      <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Enter Badge ID, Registration number, or Email.</div>
      <input type="text" id="manualCodeInput" class="manual-input" placeholder="e.g. KNOVA-ST-83942">
      <div class="modal-buttons">
        <button class="modal-btn-cancel" onclick="closeManualModal()">Cancel</button>
        <button class="modal-btn-submit" onclick="submitManualCode()">Punch Badge</button>
      </div>
    </div>
  </div>
</div>

<script>
let API_HOST = localStorage.getItem('knova_api_host') || 'https://knovaexpo.com';
document.getElementById('serverLabel').textContent = API_HOST.replace('https://', '').replace('http://', '');
let currentMode = localStorage.getItem('knova_scan_mode') || 'gate';

function openServerConfig() {
  const custom = prompt("Set KNOVA Server URL:", API_HOST);
  if (custom && custom.trim()) {
    API_HOST = custom.trim().replace(/\/$/, "");
    localStorage.setItem('knova_api_host', API_HOST);
    document.getElementById('serverLabel').textContent = API_HOST.replace('https://', '').replace('http://', '');
    fetchStats();
  }
}

function switchScannerMode(mode) {
  currentMode = mode;
  localStorage.setItem('knova_scan_mode', mode);
  document.body.className = `mode-${mode}`;
  document.querySelectorAll('.role-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
  });
  const titles = { gate: 'GATE ENTRY SCAN', booth: 'BOOTH VISIT PUNCH', seminar: 'SEMINAR ATTENDANCE', counselling: 'COUNSELLING PUNCH' };
  document.getElementById('brandTitle').textContent = titles[mode] || 'KNOVA SCAN';
  fetchStats();
}

// Audio
let audioCtx = null;
let soundEnabled = true;
function playChime(f1, f2) {
  if (!soundEnabled) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator(), g = audioCtx.createGain();
    o1.type = 'sine'; o2.type = 'sine';
    o1.frequency.setValueAtTime(f1, now); o1.frequency.exponentialRampToValueAtTime(f2, now + 0.08);
    o2.frequency.setValueAtTime(f2, now); o2.frequency.exponentialRampToValueAtTime(f2 * 1.33, now + 0.08);
    g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    o1.connect(g); o2.connect(g); g.connect(audioCtx.destination);
    o1.start(now); o2.start(now); o1.stop(now + 0.3); o2.stop(now + 0.3);
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('btnSound').innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
  document.getElementById('btnSound').classList.toggle('muted', !soundEnabled);
}

// Scanner
let html5QrCode = null;
let currentFacingMode = "environment";
let isProcessing = false;
let resumeTimer = null;
let activeVideoTrack = null;
let torchActive = false;

function startScanner() {
  if (!html5QrCode) html5QrCode = new Html5Qrcode("reader", { experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  const qrBoxSize = Math.min(window.innerWidth * 0.72, 260);
  html5QrCode.start(
    { facingMode: currentFacingMode },
    { fps: 25, qrbox: { width: qrBoxSize, height: qrBoxSize } },
    (decoded) => { if (!isProcessing) { isProcessing = true; dispatchCheckIn(decoded); } },
    () => {}
  ).then(() => {
    try {
      const v = document.querySelector("#reader video");
      if (v && v.srcObject) activeVideoTrack = v.srcObject.getVideoTracks()[0];
    } catch(e) {}
  });
}

function flipCamera() {
  currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
  if (html5QrCode) html5QrCode.stop().then(startScanner).catch(startScanner);
}

function toggleTorch() {
  if (!activeVideoTrack) { alert("Torch not supported on this camera."); return; }
  torchActive = !torchActive;
  activeVideoTrack.applyConstraints({ advanced: [{ torch: torchActive }] }).then(() => {
    document.getElementById('btnTorch').classList.toggle('active', torchActive);
  }).catch(() => { torchActive = false; });
}

async function dispatchCheckIn(code) {
  try {
    const res = await fetch(`${API_HOST}/api/mobile-checkin/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code.trim(), mode: currentMode })
    });
    const data = await res.json();
    renderResult(data, code);
  } catch(e) {
    renderResult({ status: 'ERROR', message: 'Connection failed.' }, code);
  }
}

function renderResult(data, code) {
  const sheet = document.getElementById('resultSheet');
  const banner = document.getElementById('resStatusBanner');
  const avatar = document.getElementById('resAvatar');
  const rewardPill = document.getElementById('resRewardPill');

  banner.className = 'status-banner';
  avatar.className = 'result-avatar';

  if (data.status === 'SUCCESS') {
    playChime(587.33, 880);
    if (navigator.vibrate) navigator.vibrate([70]);
    banner.classList.add('success');
    document.getElementById('resStatusIcon').className = 'fa-solid fa-circle-check';
    document.getElementById('resStatusText').textContent = data.message || 'PUNCH RECORDED';
    rewardPill.style.display = 'inline-block';
    rewardPill.textContent = data.badge_reward || 'Verified';

    const a = data.attendee || {};
    document.getElementById('resName').textContent = a.full_name || 'Attendee';
    avatar.textContent = a.initials || 'A';
    document.getElementById('resRole').textContent = (a.role || 'STUDENT').toUpperCase();
    document.getElementById('resBadgeId').textContent = a.badge_id || code;
    document.getElementById('resOrg').textContent = a.school_or_org || '-';
    document.getElementById('resTime').textContent = a.checked_in_time || 'Just now';
    document.getElementById('resStation').textContent = data.station_name || 'Verified';
    if (data.stats) updateStats(data.stats);
  } else if (data.status === 'ALREADY_CHECKED_IN' || data.status === 'ALREADY_PUNCHED') {
    playChime(440, 370);
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    banner.classList.add('warning');
    avatar.classList.add('amber');
    document.getElementById('resStatusIcon').className = 'fa-solid fa-triangle-exclamation';
    document.getElementById('resStatusText').textContent = data.message || 'ALREADY PUNCHED';
    rewardPill.style.display = 'inline-block';
    rewardPill.textContent = 'Duplicate';
    const a = data.attendee || {};
    document.getElementById('resName').textContent = a.full_name || 'Attendee';
    avatar.textContent = a.initials || 'A';
    document.getElementById('resRole').textContent = (a.role || 'STUDENT').toUpperCase();
    document.getElementById('resBadgeId').textContent = a.badge_id || code;
    document.getElementById('resOrg').textContent = a.school_or_org || '-';
    document.getElementById('resTime').textContent = a.checked_in_time || 'Earlier';
    document.getElementById('resStation').textContent = data.station_name || '-';
  } else {
    playChime(220, 110);
    if (navigator.vibrate) navigator.vibrate([300]);
    banner.classList.add('error');
    avatar.classList.add('red');
    document.getElementById('resStatusIcon').className = 'fa-solid fa-circle-xmark';
    document.getElementById('resStatusText').textContent = 'UNREGISTERED BADGE';
    rewardPill.style.display = 'none';
    document.getElementById('resName').textContent = 'Unknown Attendee';
    avatar.textContent = '?';
    document.getElementById('resBadgeId').textContent = code;
    document.getElementById('resOrg').textContent = 'Not found';
    document.getElementById('resTime').textContent = '-';
    document.getElementById('resStation').textContent = '-';
  }

  sheet.classList.add('open');
  const fill = document.getElementById('countdownFill');
  fill.style.transition = 'none'; fill.style.width = '100%';
  fill.offsetHeight;
  fill.style.transition = 'width 1.8s linear'; fill.style.width = '0%';
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(dismissResult, 1800);
}

function dismissResult() {
  clearTimeout(resumeTimer);
  document.getElementById('resultSheet').classList.remove('open');
  setTimeout(() => { isProcessing = false; }, 400);
}

function updateStats(s) {
  if (!s) return;
  if (s.station_label) document.getElementById('statLabel').textContent = `${s.station_label}:`;
  if (s.station_count !== undefined) document.getElementById('statCount').textContent = s.station_count;
  else if (s.total_checked_in !== undefined) document.getElementById('statCount').textContent = s.total_checked_in;
}

async function fetchStats() {
  try {
    const r = await fetch(`${API_HOST}/api/mobile-checkin/stats/?mode=${currentMode}`);
    const d = await r.json();
    if (d.status === 'SUCCESS') updateStats(d);
  } catch(e) {}
}

function openManualModal() { document.getElementById('manualModal').classList.add('open'); document.getElementById('manualCodeInput').value = ''; }
function closeManualModal() { document.getElementById('manualModal').classList.remove('open'); }
function submitManualCode() {
  const c = document.getElementById('manualCodeInput').value.trim();
  if (c) { closeManualModal(); isProcessing = true; dispatchCheckIn(c); }
}

window.addEventListener('DOMContentLoaded', () => {
  switchScannerMode(currentMode);
  startScanner();
  setInterval(fetchStats, 15000);
});
</script>
</body>
</html>
